# Glide v0.2 configuration file
# Default locations:
#   Linux:   ~/.config/glide/glide.toml
#   Windows: %APPDATA%\glide\config\glide.toml
#
# Both [server] and [client] sections live in the same file so either machine
# can act as Primary or Secondary anytime. Editing via the GUI updates this file
# and hot-reloads active sessions without restarting.

[server]
# Shown during LocalSend-style LAN auto-discovery (defaults to real hostname)
# name = "my-workstation"

# UDP bind address for QUIC transport
bind = "0.0.0.0:24800"

# Broadcast presence on LAN so clients connect without typing an IP
discovery = true
discovery_port = 24801

# Local escape key that immediately snaps control back to this server
escape_key = "ScrollLock"

# Pixels to push past an outer monitor edge before switching to a client
edge_threshold_px = 4

# Corner dead-zone in pixels (prevents accidental switches when clicking close X or Show Desktop)
dead_corner_px = 24

# Optional edge dwell delay in milliseconds (0 = instant)
edge_dwell_ms = 0

# Automatically pause edge switching while a fullscreen game/app has focus
auto_lock_fullscreen = true

# Enable Ctrl+Alt+Arrow direct screen jumps (with cursor memory) and Ctrl+Alt+L cursor lock
enable_hotkeys = true

# Sync CapsLock and NumLock state onto clients on screen entry
sync_lock_keys = true

# Bidirectional UTF-8 text + universal PNG/CF_DIB screenshot clipboard sync
clipboard = true

# High-polling-rate mouse coalescing window in microseconds (1000 = 1000Hz max; 0 = immediate)
motion_coalesce_us = 1000

[client]
# Explicit server IP:port is OPTIONAL. Leave commented out for LAN auto-discovery!
# server = "192.168.1.42:24800"

# Optional server hostname filter if multiple Glide servers run on your LAN
# server_name = "DESKTOP-WIN11"

# Which edge of the SERVER this client sits on: "left", "right", "top", or "bottom"
edge = "right"

discovery_port = 24801

# Optional pinned SHA-256 fingerprint (omit to use automatic Trust-On-First-Use)
# trusted_fingerprint = "aa:bb:cc:..."

# Mouse sensitivity multiplier (1.0 = raw 1:1)
sensitivity = 1.0

# Automatically scale pointer deltas by client_dpi / server_dpi
auto_dpi_scale = false

# Scroll wheel speed multiplier and natural-scroll inversion
scroll_speed = 1.0
invert_scroll = false

# Pixels to push past the return edge & corner dead-zone
edge_threshold_px = 4
dead_corner_px = 24

# Sync CapsLock / NumLock state on screen entry
sync_lock_keys = true

# Linux client input backend: "auto" (XTest, zero setup) or "uinput" (hardware-native kernel HID)
input_backend = "auto"

# Bidirectional clipboard sync
clipboard = true

# Optional declarative per-client physical key remapping rules:
# [[client.key_remap]]
# from = "CapsLock"
# to = "ControlLeft"
