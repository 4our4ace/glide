name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.3.0)"
        required: true
        default: "v0.3.0"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux link dependency
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release binary
        env:
          GLIDE_BUILD_CHANNEL: stable
          GLIDE_BUILD_SHA: ${{ github.sha }}
        run: cargo build --release --locked --bin glide

      - name: Package .deb and stage artifacts
        run: |
          mkdir -p release-artifacts
          cp target/release/glide release-artifacts/glide-linux-x86_64
          ./scripts/build-deb.sh target/release/glide
          cp dist/glide_*_amd64.deb release-artifacts/
          ls -lh release-artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: release-artifacts/*

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build standalone Windows binary (static CRT)
        env:
          GLIDE_BUILD_CHANNEL: stable
          GLIDE_BUILD_SHA: ${{ github.sha }}
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked --bin glide

      - name: Build Windows MSI installer and stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item target\release\glide.exe release-artifacts\glide-windows-x86_64.exe
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          if (-not (Test-Path $wix)) {
            dotnet tool install --global wix --version 5.0.2
          }
          & $wix build packaging\windows\glide.wxs `
            -arch x64 `
            -d "Version=$ver" `
            -d "ExePath=target\release\glide.exe" `
            -d "IconPath=packaging\windows\glide.ico" `
            -o release-artifacts\glide-windows-x86_64.msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Force -ErrorAction SilentlyContinue release-artifacts\*.wixpdb
          Get-ChildItem release-artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release-artifacts/*

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          (cd release-assets && sha256sum glide-windows-x86_64.msi glide-windows-x86_64.exe glide-linux-x86_64 glide_*_amd64.deb > SHA256SUMS.txt)
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          DEB_FILE="$(basename release-assets/glide_*_amd64.deb)"
          cat > release-notes.md <<EOF
          One mouse and keyboard across your Windows 11 and Linux PCs — directly over your local network, with no account and no cloud.

          ### What's included
          - **Native UI (Light & Dark mode)** — Single standalone app with drag-and-drop screen arrangement, automatic LAN discovery, live latency indicator, and system tray support.
          - **Seamless cursor & keyboard sharing** — Clean cursor hiding on idle screens, corner guards, fullscreen game auto-lock, Caps Lock / Num Lock LED sync, German/EU ISO keyboard support, and per-PC pointer speed & key remapping.
          - **Shared clipboard & file drop** — Sync text and screenshots (\`Win+Shift+S\`, Snipping Tool, browsers, Flameshot) in both directions with toggleable/hideable history, plus drag-and-drop LAN file transfers into \`Downloads/Glide\`.
          - **Auto-reconnect** — Remembers whether each PC is a Server or Client and reconnects automatically on launch.

          ### Downloads
          - **Windows 11 Installer (Recommended):** Download and double-click \`glide-windows-x86_64.msi\` *(per-user install to \`%LOCALAPPDATA%\Programs\Glide\`, Start Menu shortcut, Apps & Features uninstaller, no admin/UAC prompt required)*.
          - **Windows 11 Portable:** \`glide-windows-x86_64.exe\` *(standalone — no installer or extra DLLs needed)*.
          - **Ubuntu / Debian Linux (X11 & Wayland):** Download \`${DEB_FILE}\` and run:
            \`\`\`bash
            sudo apt install ./${DEB_FILE}
            \`\`\`
          - **Linux standalone binary:** \`glide-linux-x86_64\`
          - **Checksums:** \`SHA256SUMS.txt\`
          EOF

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "Glide ${TAG}" --notes-file release-notes.md --draft=false --latest
          else
            gh release create "$TAG" release-assets/* \
              -R "$GITHUB_REPOSITORY" \
              --title "Glide ${TAG}" \
              --notes-file release-notes.md \
              --latest
          fi
