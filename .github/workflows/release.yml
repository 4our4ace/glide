name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.6.0)"
        required: true
        default: "v0.6.0"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux link dependency
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - name: Run workspace tests
        env:
          GLIDE_BUILD_CHANNEL: stable
        run: cargo test --workspace --locked

      - name: Build release binary
        env:
          GLIDE_BUILD_CHANNEL: stable
          GLIDE_BUILD_SHA: ${{ github.sha }}
        run: cargo build --release --locked --bin glide

      - name: Package .deb and stage artifacts
        run: |
          mkdir -p release-artifacts
          cp target/release/glide release-artifacts/glide-linux-x86_64-standalone
          ./scripts/build-deb.sh target/release/glide
          cp dist/glide_*_amd64.deb release-artifacts/
          ls -lh release-artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: release-artifacts/*

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        env:
          GLIDE_BUILD_CHANNEL: stable
        run: cargo test --workspace --locked

      - name: Build standalone Windows binary (static CRT)
        env:
          GLIDE_BUILD_CHANNEL: stable
          GLIDE_BUILD_SHA: ${{ github.sha }}
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked --bin glide

      - name: Build Windows MSI installer and stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item target\release\glide.exe release-artifacts\glide-windows-x86_64-standalone.exe
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          if (-not (Test-Path $wix)) {
            dotnet tool install --global wix --version 5.0.2
          }
          & $wix build packaging\windows\glide.wxs `
            -arch x64 `
            -d "Version=$ver" `
            -d "ExePath=target\release\glide.exe" `
            -d "IconPath=packaging\windows\glide.ico" `
            -o release-artifacts\glide-windows-x86_64-installer.msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Force -ErrorAction SilentlyContinue release-artifacts\*.wixpdb
          Get-ChildItem release-artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release-artifacts/*

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          (cd release-assets && sha256sum glide-windows-x86_64-installer.msi glide-windows-x86_64-standalone.exe glide-linux-x86_64-standalone glide_*_amd64.deb > SHA256SUMS.txt)
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          DEB_FILE="$(basename release-assets/glide_*_amd64.deb)"
          cat > release-notes.md <<EOF
          One mouse and keyboard across your Windows 11 and Linux PCs — directly over your local network, with no account and no cloud.

          ### Highlights in ${TAG}
          - **True 0.00 Hz zero-polling architecture** — Eliminated every periodic polling timer across networking, OS backends, and GUI: zero idle QUIC keepalive packets, event-driven LAN discovery & OS network-change listeners (\`RTNETLINK\` on Linux, \`iphlpapi\` on Windows), \`timerfd\` wake detection, \`SetWinEventHook\` / EWMH fullscreen tracking, \`XI_RawMotion\` push cursor reveal, and GPU/socket parking when minimized to tray.
          - **Instant OS shutdown, sleep & signal cursor snap-back** — Native \`systemd-logind\` (Linux) and \`WM_QUERYENDSESSION\` / \`WM_POWERBROADCAST\` (Windows) lifecycle monitors flush QUIC \`CONNECTION_CLOSE\` frames before releasing OS shutdown/sleep delay inhibitors so shutting down or sleeping a client PC snaps your mouse straight back to the server instantaneously.
          - **Optional "Unfocus window on leave" & saved focus restore** — Cleanly unfocus the active window on Windows 11 and Linux X11 when your cursor leaves a PC (preventing stray typing/hotkeys) and automatically restore focus when you return.
          - **Smart fullscreen video & browser handling** — Keep fullscreen games auto-locked while allowing seamless cursor crossings out of fullscreen video players and browsers (while still locking pointer-locked browser games).
          - **Keyboard & modifier reliability fixes** — Eliminated stuck local \`Ctrl\` on Windows servers and fixed modifier key-repeat desync on clients, plus hardened X11 EWMH focus cleanup and Windows focus-restore edge cases.

          ### Downloads
          - **Windows 11 Installer (Recommended):** Download and double-click \`glide-windows-x86_64-installer.msi\` *(per-user install to \`%LOCALAPPDATA%\Programs\Glide\`, Start Menu shortcut, Apps & Features uninstaller, no admin/UAC prompt required)*.
          - **Windows 11 Standalone (Portable):** \`glide-windows-x86_64-standalone.exe\` *(no installer or extra DLLs needed)*.
          - **Ubuntu / Debian Linux (X11 & Wayland):** Download \`${DEB_FILE}\` and run:
            \`\`\`bash
            sudo apt install ./${DEB_FILE}
            \`\`\`
          - **Linux Standalone (Portable):** \`glide-linux-x86_64-standalone\`
          - **Checksums:** \`SHA256SUMS.txt\`
          EOF

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "Glide ${TAG}" --notes-file release-notes.md --draft=false --latest
          else
            gh release create "$TAG" release-assets/* \
              -R "$GITHUB_REPOSITORY" \
              --title "Glide ${TAG}" \
              --notes-file release-notes.md \
              --latest
          fi
