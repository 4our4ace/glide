[workspace]
resolver = "2"
members = [
    "crates/glide-hid",
    "crates/glide-proto",
    "crates/glide-net",
    "crates/glide-backend",
    "crates/glide-core",
    "crates/glide-gui",
    "crates/glide-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glide-hid = { path = "crates/glide-hid" }
glide-proto = { path = "crates/glide-proto" }
glide-net = { path = "crates/glide-net" }
glide-backend = { path = "crates/glide-backend" }
glide-core = { path = "crates/glide-core" }
glide-gui = { path = "crates/glide-gui" }

anyhow = "1.0"
bytes = "1.7"
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
if-addrs = "0.13"
libc = "0.2"
parking_lot = "0.12"
png = "0.17"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Platform-specific dependencies (pure Rust, zero system C dev libraries)
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
x11rb = { version = "0.13", features = ["randr", "xinput", "xtest", "xfixes"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
